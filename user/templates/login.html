{% extends 'base.html' %}
{% load static %}
{% block title %}Login{% endblock %}

{% block content %}
<div class="max-w-[480px] w-full mx-auto mt-16">
  <div class="p-6 sm:p-8 rounded-2xl bg-white border border-gray-200 shadow-sm">
    <h1 class="text-slate-900 text-center text-3xl font-semibold">Sign in</h1>

    <form method="POST" action="" class="mt-12 space-y-6" id="loginForm">
      {% csrf_token %}

      <!-- Employee ID -->
      <div>
        <label class="text-slate-900 text-sm font-medium mb-2 block">Employee ID</label>
        <div class="relative flex items-center">
          <input name="employee_id" id="id_employee_id" type="text" required
            class="w-full text-slate-900 text-sm border {% if login_error %}border-red-500{% else %}border-slate-300{% endif %} px-4 py-3 rounded-md outline-blue-600"
            placeholder="Enter your employee ID" value="{{ request.POST.employee_id|default:'' }}" />
          <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5 absolute right-3 text-gray-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5.121 17.804A4 4 0 016 16h12a4 4 0 01.879 1.804M12 12a4 4 0 100-8 4 4 0 000 8z" />
          </svg>
        </div>
        {% if login_error %}
        <p class="text-red-500 text-xs mt-1">{{ login_error }}</p>
        {% endif %}
      </div>

      <!-- Password -->
      <div>
        <label class="text-slate-900 text-sm font-medium mb-2 block">Password</label>
        <div class="relative flex items-center">
          <input name="password" id="id_password" type="password" required
            class="w-full text-slate-900 text-sm border {% if login_error %}border-red-500{% else %}border-slate-300{% endif %} px-4 py-3 pr-10 rounded-md outline-blue-600"
            placeholder="Enter password" />
          <button type="button" onclick="togglePassword('id_password', this)"
            class="absolute right-3 top-3 text-gray-400 hover:text-gray-600"
            aria-label="Toggle password visibility">
            <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
            </svg>
          </button>
        </div>
        {% if login_error %}
        <p class="text-red-500 text-xs mt-1">{{ login_error }}</p>
        {% endif %}
      </div>

      <div class="!mt-12">
        <button type="submit" id="loginBtn"
          class="w-full py-2 px-4 text-[15px] font-medium tracking-wide rounded-md text-white bg-blue-600 hover:bg-blue-700 focus:outline-none cursor-pointer">
          <span id="btnText">Sign in</span>
            <span id="btnSpinner" class="hidden ml-2 inline-block w-5 h-5 border-2 border-white border-t-transparent rounded-full animate-spin"></span>
        </button>
      </div>

      <p class="text-slate-900 text-sm !mt-6 text-center">
        Don't have an account?
        <a href="{% url 'signup_view' %}" class="text-blue-600 hover:underline ml-1 whitespace-nowrap font-semibold">
          Register here
        </a>
      </p>
    </form>
  </div>
</div>
<script>
function togglePassword(inputId, buttonElement) {
  const input = document.getElementById(inputId);
  if (!input) return;

  const isPassword = input.type === 'password';
  input.type = isPassword ? 'text' : 'password';

  const svg = buttonElement.querySelector('svg');
  if (svg) {
    if (isPassword) {
      svg.innerHTML = `
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.477 0 8.268 2.943 9.542 7-1.274 4.057-5.065 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
      `;
    } else {
      svg.innerHTML = `
        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3.98 8.223A10.477 10.477 0 001.934 12C3.226 16.338 7.244 19.5 12 19.5c.993 0 1.953-.138 2.863-.395M6.228 6.228A10.45 10.45 0 0112 4.5c4.756 0 8.773 3.162 10.065 7.498a10.523 10.523 0 01-4.293 5.774M6.228 6.228L3 3m3.228 3.228l3.65 3.65m7.894 7.894L21 21m-3.228-3.228l-3.65-3.65m0 0a3 3 0 10-4.243-4.243m4.242 4.242L9.88 9.88" />
      `;
    }
  }
  input.focus();
}

// SweetAlert only for success messages
document.addEventListener("DOMContentLoaded", () => {
  {% if messages %}
    {% for message in messages %}
      {% if message.tags == 'success' %}
        Swal.fire({
          icon: 'success',
          title: "{{ message|escapejs }}",
          showConfirmButton: false,
          timer: 2000,
          toast: true,
          position: 'top-end',
          timerProgressBar: true
        });
      {% endif %}
    {% endfor %}
  {% endif %}
});

document.getElementById('loginForm').addEventListener('submit', function() {
  const btn = document.getElementById('loginBtn');
  const btnText = document.getElementById('btnText');
  const btnSpinner = document.getElementById('btnSpinner');

  btn.disabled = true;
  btnText.classList.add('hidden');
  btnSpinner.classList.remove('hidden');
});
</script>
{% endblock %}
