{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{% block title %}My App{% endblock %}</title>

  <!-- Favicon -->
<link rel="icon" type="image/png" href="{% static 'user/images/mri(1).png' %}">


  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

  <!-- Material Icons -->
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">

  <!-- SweetAlert2 -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

  {% block extra_head %}{% endblock %}
</head>
<body class="bg-gray-50 min-h-screen flex flex-col items-center justify-center py-6 px-4">

  {% block content %}{% endblock %}

  <!-- SweetAlert2 for Django messages -->
  <script>
    document.addEventListener("DOMContentLoaded", () => {
      {% if messages %}
        {% for message in messages %}
          Swal.fire({
            icon: "{% if 'success' in message.tags %}success{% elif 'error' in message.tags %}error{% else %}info{% endif %}",
            title: "{{ message|escapejs }}",
            showConfirmButton: false,
            timer: 2000,
            toast: true,
            position: 'top-end',
            timerProgressBar: true
          });
        {% endfor %}
      {% endif %}
    });
  </script>

  {% block extra_scripts %}{% endblock %}
</body>
</html>
