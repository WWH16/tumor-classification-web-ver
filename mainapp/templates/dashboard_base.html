{% load static %}
<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{% block title %}Dashboard{% endblock %}</title>
  <!-- Tailwind + DaisyUI CDN -->
  <link href="https://cdn.jsdelivr.net/npm/daisyui@4.12.10/dist/full.min.css" rel="stylesheet" type="text/css" />
  <script src="https://cdn.tailwindcss.com"></script>
<style>
    /* Smooth transition for width and text */
    .sidebar {
      transition: width 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      overflow: hidden;
    }
    .sidebar ul li a {
      transition: all 0.3s ease;
    }
    /* Center icons when collapsed */
    .sidebar.collapsed ul li a {
      justify-content: center;
    }
    .sidebar.collapsed ul li a .sidebar-text {
      display: none;
    }
    .sidebar-text {
      transition: opacity 0.2s ease;
    }
    .sidebar.collapsed .sidebar-text {
      opacity: 0;
    }
    /* Ensure drawer toggle button stays at bottom */
    .drawer-side .toggle-container {
      margin-top: auto;
      padding: 1rem;
    }
    /* Remove hover effect from toggle button */
    #toggle-btn {
      background: transparent !important;
    }
    #toggle-btn:hover {
      background: transparent !important;
    }
    #toggle-btn svg {
      transition: transform 0.3s ease;
    }
    #toggle-btn:hover svg {
      transform: scale(1.1);
    }
  </style>

  {% block extra_head %}{% endblock %}
</head>
<body class="min-h-screen bg-base-100">

  <!-- Drawer Layout -->
  <div class="drawer drawer-mobile lg:drawer-open">
    <input id="sidebar-toggle" type="checkbox" class="drawer-toggle" />

    <!-- Page Content -->
    <div class="bg-[#f5f5f5] drawer-content p-6">
      {% block content %}
      <!-- Your main page content -->
      {% endblock %}
    </div>

<!-- Sidebar -->
<div class="drawer-side">
  <label for="sidebar-toggle" class="drawer-overlay"></label>
  <div id="sidebar" class="sidebar bg-base-200 min-h-full flex flex-col" style="width:16rem; position: relative;">
    <!-- Add a vertical divider -->
    <div class="absolute top-0 right-0 h-full w-[1px] bg-neutral/30"></div> <!-- smoky black line -->

    <!-- Sidebar Menu -->
    <ul id="sidebar-menu" class="menu p-4 grow flex flex-col gap-1">
      <li>
        <a href="#" class="flex items-center gap-2 p-2 hover:bg-base-300 rounded">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               class="w-5 h-5">
            <path d="M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8"></path>
            <path d="M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          </svg>
          <span class="sidebar-text">Homepage</span>
        </a>
      </li>
      <li>
        <a href="#" class="flex items-center gap-2 p-2 hover:bg-base-300 rounded">
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"
               fill="none" stroke="currentColor" stroke-width="2"
               stroke-linecap="round" stroke-linejoin="round"
               class="w-5 h-5">
            <path d="M20 7h-9"></path>
            <path d="M14 17H5"></path>
            <circle cx="17" cy="17" r="3"></circle>
            <circle cx="7" cy="7" r="3"></circle>
          </svg>
          <span class="sidebar-text">Settings</span>
        </a>
      </li>
    </ul>

    <!-- Drawer Toggle Button -->
    <div class="toggle-container">
      <button id="toggle-btn" class="btn btn-ghost btn-circle w-full flex justify-center">
        <svg xmlns="http://www.w3.org/2000/svg" class="w-5 h-5" fill="none"
             stroke="currentColor" stroke-width="2" stroke-linecap="round"
             stroke-linejoin="round" viewBox="0 0 24 24">
          <path d="M4 4m0 2a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z"/>
          <path d="M9 4v16"/>
          <path d="M14 10l2 2l-2 2"/>
        </svg>
      </button>
    </div>
  </div>
</div>


  {% block extra_scripts %}{% endblock %}
  <script>
    const toggleBtn = document.getElementById('toggle-btn');
    const sidebar = document.getElementById('sidebar');

    toggleBtn.addEventListener('click', () => {
      sidebar.classList.toggle('collapsed');
      if (sidebar.classList.contains('collapsed')) {
        sidebar.style.width = '4rem';
      } else {
        sidebar.style.width = '16rem';
      }
    });
  </script>
</body>
</html>
